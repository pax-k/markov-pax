name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun ci

      - name: Check source, tests, coverage, and documents
        run: bun run check:source

      - name: Build ESM and declarations
        run: bun run build

      - name: Test packed artifact in a clean consumer
        run: bun run test:package
